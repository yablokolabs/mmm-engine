name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0 (tag is created on the selected branch)"
        required: true

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  binaries:
    name: Binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check version format
        run: echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version '$VERSION'"; exit 1; }
      - uses: actions/checkout@v4
      - name: Build portable binary
        run: |
          cmake -S . -B build -DMMM_NATIVE=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build -- -j"$(nproc)"
          ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          name="mmm-${VERSION}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp build/mmm README.md LICENSE CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mmm-linux-${{ matrix.arch }}
          path: mmm-*.tar.gz*

  release:
    name: GitHub release
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="## ${VERSION}" '
            $0 == tag {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`sh
          curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/mmm-${VERSION}-linux-x86_64.tar.gz
          tar -xzf mmm-${VERSION}-linux-x86_64.tar.gz
          ./mmm-${VERSION}-linux-x86_64/mmm help
          \`\`\`

          Needs glibc 2.38+ (Ubuntu 24.04+, Debian 13+, Fedora 39+). Older systems: use Docker.

          Docker: \`docker run --rm -v "\$PWD:/work" ghcr.io/${GITHUB_REPOSITORY}:${VERSION#v} help\`
          NOTES
          test -s notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "MMM Engine $VERSION" --notes-file notes.md

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
